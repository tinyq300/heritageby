<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Историческая беседа</title>
</head>
<body>
    <p><a id="chatLink" href="gallery.html?chat=euphrosyne">Открыть беседу с героиней</a></p>
    <script>
        const heroineId = new URLSearchParams(location.search).get('heroine') || 'euphrosyne';
        const target = 'gallery.html?chat=' + encodeURIComponent(heroineId);
        document.getElementById('chatLink').href = target;
        location.replace(target);
    </script>
</body>
</html>
