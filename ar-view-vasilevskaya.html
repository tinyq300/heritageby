<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR: Ракета Марины Василевской</title>

    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
            color: #FFFFFF;
            background: transparent !important;
        }

        /* Верхняя информационная панель */
        .ar-top-bar {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 92%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .ar-ui-card {
            width: 100%;
            background: linear-gradient(135deg, rgba(139, 21, 56, 0.94), rgba(74, 8, 28, 0.96));
            color: #FFFFFF;
            padding: 12px 20px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(139, 21, 56, 0.45),
                        0 0 20px rgba(212, 175, 55, 0.25),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1.5px solid rgba(212, 175, 55, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: royal-glow 4s ease-in-out infinite;
            pointer-events: auto;
        }

        @keyframes royal-glow {
            0%, 100% {
                box-shadow: 0 8px 32px rgba(139, 21, 56, 0.45),
                            0 0 20px rgba(212, 175, 55, 0.25);
                border-color: rgba(212, 175, 55, 0.45);
            }
            50% {
                box-shadow: 0 8px 36px rgba(139, 21, 56, 0.65),
                            0 0 32px rgba(255, 215, 0, 0.45);
                border-color: rgba(255, 215, 0, 0.75);
            }
        }

        .ar-ui-title {
            font-family: 'Philosopher', sans-serif;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #FFF8E7;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
            letter-spacing: 0.5px;
        }

        .ar-ui-subtitle {
            font-size: 13.5px;
            font-weight: 400;
            color: #F7E7CE;
            line-height: 1.35;
        }

        /* Всплывающая плашка масштаба */
        .zoom-badge {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(45, 8, 24, 0.92);
            border: 1.5px solid rgba(212, 175, 55, 0.55);
            border-radius: 20px;
            padding: 6px 18px;
            font-size: 13.5px;
            font-weight: bold;
            color: #FFD700;
            font-family: 'Philosopher', sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .zoom-badge.show {
            opacity: 1;
        }

        /* Рамка поиска маркера */
        .marker-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            text-align: center;
            pointer-events: none;
            display: block;
        }

        .scan-frame {
            width: 220px;
            height: 220px;
            border: 2px solid rgba(212, 175, 55, 0.45);
            border-radius: 20px;
            position: relative;
            margin: 0 auto;
            animation: scan-pulse 2s ease-in-out infinite;
        }

        @keyframes scan-pulse {
            0%, 100% {
                border-color: rgba(212, 175, 55, 0.45);
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
            }
            50% {
                border-color: rgba(255, 215, 0, 0.95);
                box-shadow: 0 0 35px rgba(212, 175, 55, 0.55);
            }
        }

        .scan-frame::before,
        .scan-frame::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border: 3.5px solid #D4AF37;
        }

        .scan-frame::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 14px;
        }

        .scan-frame::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 14px;
        }

        .scan-text {
            margin-top: 15px;
            color: #FFF8E7;
            font-size: 14.5px;
            font-family: 'Philosopher', sans-serif;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 12px rgba(212, 175, 55, 0.5);
            animation: fade-text 2s ease-in-out infinite;
        }

        @keyframes fade-text {
            0%, 100% { opacity: 0.65; }
            50% { opacity: 1; }
        }

        /* --- НИЖНЯЯ ПАНЕЛЬ КНОПОК КАМЕРЫ --- */
        .controls-dock {
            position: fixed;
            bottom: 82px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(139, 21, 56, 0.94), rgba(74, 8, 28, 0.96));
            padding: 8px 18px;
            border-radius: 35px;
            border: 1.5px solid rgba(212, 175, 55, 0.45);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 22px rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            max-width: 95%;
            overflow-x: auto;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: #FFF8E7;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        .ctrl-btn:hover,
        .ctrl-btn:active {
            background: linear-gradient(135deg, #D4AF37, #B8860B);
            color: #2A081E;
            border-color: #FFD700;
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.7);
        }

        .ctrl-btn.active-toggle {
            background: linear-gradient(135deg, #D4AF37, #B8860B);
            color: #2A081E;
            border-color: #FFD700;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
        }

        /* Кнопка возврата в галерею */
        .back-btn {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: linear-gradient(135deg, #8B1538 0%, #54091e 100%);
            color: #FFF8E7;
            padding: 10px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-family: 'Philosopher', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(139, 21, 56, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1.5px solid rgba(212, 175, 55, 0.55);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .back-btn:hover,
        .back-btn:active {
            transform: translateX(-50%) translateY(2px);
            box-shadow: 0 3px 14px rgba(212, 175, 55, 0.6);
            filter: brightness(1.15);
        }

        /* Загрузочный экран */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #26081B 0%, #12040D 100%);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-ring {
            width: 58px;
            height: 58px;
            border: 4px solid rgba(212, 175, 55, 0.25);
            border-top-color: #D4AF37;
            border-radius: 50%;
            animation: spin-loader 1s linear infinite;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
        }

        @keyframes spin-loader {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 18px;
            color: #FFF8E7;
            font-size: 18px;
            font-family: 'Philosopher', sans-serif;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
        }

        /* Слой захвата жестов (мышь и тачскрин) */
        #touchSurface {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: grab;
        }

        #touchSurface:active {
            cursor: grabbing;
        }
    </style>
</head>

<body>
    <!-- Сенсорный слой для вращения и зума мышь/тач -->
    <div id="touchSurface"></div>

    <!-- Экран загрузки -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-ring"></div>
        <div class="loading-text">Загрузка AR корабля Василевской...</div>
    </div>

    <!-- Верхняя панель: заголовок и инструкции -->
    <div class="ar-top-bar">
        <div class="ar-ui-card">
            <div class="ar-ui-title">✨ Ракета Марины Василевской ✨</div>
            <div class="ar-ui-subtitle">
                Наведите камеру на маркер • Управляйте ракетой кнопками снизу или жестами
            </div>
        </div>
    </div>

    <!-- Индикатор текущего масштаба -->
    <div class="zoom-badge" id="zoomBadge">Масштаб: 100%</div>

    <!-- Индикатор поиска маркера -->
    <div class="marker-indicator" id="markerIndicator">
        <div class="scan-frame"></div>
        <div class="scan-text">📱 Наведите камеру на маркер Василевской</div>
    </div>

    <!-- ПАНЕЛЬ КНОПОК: ПРИБЛИЖАТЬ, ОТДАЛЯТЬ, ВЕРТЕТЬ -->
    <div class="controls-dock">
        <button class="ctrl-btn" onclick="window.arControls.zoomIn()" title="Приблизить (Zoom In)">
            🔍+
        </button>
        <button class="ctrl-btn" onclick="window.arControls.zoomOut()" title="Отдалить (Zoom Out)">
            🔍−
        </button>
        <button class="ctrl-btn" onclick="window.arControls.rotateLeft()" title="Повернуть влево (30°)">
            ⟲
        </button>
        <button class="ctrl-btn" onclick="window.arControls.rotateRight()" title="Повернуть вправо (30°)">
            ⟳
        </button>
        <button class="ctrl-btn active-toggle" id="btnAutoSpin" onclick="window.arControls.toggleAutoRotate()" title="Авто-вращение вкл/выкл">
            ⏸
        </button>
        <button class="ctrl-btn" onclick="window.arControls.resetView()" title="Сбросить угол и размер">
            ↺
        </button>
    </div>

    <!-- Кнопка возврата в галерею -->
    <a href="gallery.html" class="back-btn">← Вернуться в галерею</a>

    <!-- AR СЦЕНА -->
    <a-scene 
        embedded 
        vr-mode-ui="enabled: false" 
        arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.8;"
        id="scene">

        <!-- ЯРКОЕ ОСВЕЩЕНИЕ СЦЕНЫ -->
        <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.6"></a-entity>
        <a-entity light="type: directional; color: #FFF8E7; intensity: 2.2" position="4 7 5"></a-entity>
        <a-entity light="type: directional; color: #D4AF37; intensity: 1.2" position="-4 -2 -3"></a-entity>

        <!-- AR Маркер Марины Василевской -->
        <a-marker 
            type="pattern" 
            url="patterns/pattern-mari.patt" 
            raycaster="objects: .clickable" 
            emitevents="true" 
            cursor="fuse: false; rayOrigin: mouse;"
            id="arMarker">
            
            <!-- Узел ракеты: начальная ориентация носом ВВЕРХ (-90 deg по X для вертикального маркера) -->
            <a-entity id="rocketAssembly" position="0 0.1 0" rotation="-90 0 0">
                
                <!-- 3D Модель ракеты «Союз МС-25» -->
                <a-entity id="rocketModel" 
                          gltf-model="url(models/rocket.glb)" 
                          scale="0.13 0.13 0.13" 
                          position="0 0 0" 
                          rotation="0 0 0">
                </a-entity>

                <!-- Оранжево-пламенная подсветка сопла -->
                <a-light id="engineFlameLight"
                         type="point" 
                         color="#F97316" 
                         intensity="3.0" 
                         position="0 0.05 0"
                         distance="4.0">
                </a-light>

                <!-- Золотистое свечение ионизации -->
                <a-light type="point" 
                         color="#FFD700" 
                         intensity="2.0" 
                         position="0 0.25 0"
                         distance="3.5">
                </a-light>

                <!-- Светящееся орбитальное кольцо у основания ракеты -->
                <a-ring id="orbitRing"
                        color="#D4AF37" 
                        radius-inner="0.45" 
                        radius-outer="0.55" 
                        position="0 0.02 0"
                        rotation="-90 0 0"
                        material="shader: flat; opacity: 0.75; transparent: true">
                </a-ring>

                <!-- Внешнее звездное кольцо -->
                <a-ring id="outerRing"
                        color="#FFD700" 
                        radius-inner="0.65" 
                        radius-outer="0.70" 
                        position="0 -0.01 0"
                        rotation="-90 0 0"
                        material="shader: flat; opacity: 0.5; transparent: true">
                </a-ring>

                <!-- Мерцающие золотые искры вокруг корабля -->
                <a-entity id="space-sparkles">
                    <a-sphere color="#FFD700" 
                              radius="0.018" 
                              position="0.35 0.5 0.25"
                              material="emissive: #FFD700; emissiveIntensity: 2.5">
                    </a-sphere>
                    <a-sphere color="#FFF8E7" 
                              radius="0.018" 
                              position="-0.32 0.35 -0.28"
                              material="emissive: #FFF8E7; emissiveIntensity: 2.5">
                    </a-sphere>
                    <a-sphere color="#D4AF37" 
                              radius="0.018" 
                              position="0.28 0.25 -0.32"
                              material="emissive: #D4AF37; emissiveIntensity: 2.5">
                    </a-sphere>
                </a-entity>
            </a-entity>
        </a-marker>

        <!-- Камера сцены -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // =================================================================
        // КОНТРОЛЛЕР AR КАМЕРЫ: ВРАЩЕНИЕ, ЗУМ И ИНТЕРАКТИВНОСТЬ
        // =================================================================
        class RocketInteractiveController {
            constructor() {
                this.assemblyEl = document.getElementById('rocketAssembly');
                this.modelEl = document.getElementById('rocketModel');
                this.touchSurface = document.getElementById('touchSurface');
                this.zoomBadge = document.getElementById('zoomBadge');
                this.btnAutoSpin = document.getElementById('btnAutoSpin');
                this.markerIndicator = document.getElementById('markerIndicator');

                // Параметры масштаба (зума)
                this.baseScale = 0.13;
                this.currentScale = 0.13;
                this.minScale = 0.035; // Уменьшение до 25%
                this.maxScale = 0.45;  // Приближение до 350%

                // Параметры вращения: в AR режиме носом ВВЕРХ (-90° по X)
                this.rotX = -90;
                this.rotY = 0;
                this.autoRotate = true;
                this.autoRotateSpeed = 22; // градусов в секунду

                // Управление касаниями и жестами
                this.isPointerDown = false;
                this.activePointers = new Map();
                this.initialPinchDistance = 0;
                this.scaleAtPinchStart = 0.13;
                this.inactivityTimer = null;
                this.lastTime = performance.now();

                this.init();
            }

            init() {
                // Жесты мыши и тачскрина
                this.touchSurface.addEventListener('pointerdown', this.onPointerDown.bind(this));
                window.addEventListener('pointermove', this.onPointerMove.bind(this));
                window.addEventListener('pointerup', this.onPointerUp.bind(this));
                window.addEventListener('pointercancel', this.onPointerUp.bind(this));

                // Колесико мыши для зума на ПК
                this.touchSurface.addEventListener('wheel', this.onWheel.bind(this), { passive: false });

                // Гарантированная яркость текстур при загрузке модели
                if (this.modelEl) {
                    this.modelEl.addEventListener('model-loaded', () => {
                        const mesh = this.modelEl.getObject3D('mesh');
                        if (mesh) {
                            mesh.traverse((node) => {
                                if (node.isMesh && node.material) {
                                    node.material.metalness = 0.05;
                                    node.material.roughness = 0.45;
                                    node.material.needsUpdate = true;
                                }
                            });
                        }
                        this.applyTransform();
                    });
                }

                // Запуск цикла анимации
                requestAnimationFrame(this.tick.bind(this));
                this.applyTransform();
            }

            // --- ОБРАБОТКА КАСАНИЙ И ЖЕСТОВ МЫШИ/ТАЧСКРИНА ---
            onPointerDown(e) {
                this.isPointerDown = true;
                try { this.touchSurface.setPointerCapture(e.pointerId); } catch (_) {}
                this.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (this.activePointers.size === 2) {
                    const pointers = Array.from(this.activePointers.values());
                    this.initialPinchDistance = Math.hypot(pointers[1].x - pointers[0].x, pointers[1].y - pointers[0].y);
                    this.scaleAtPinchStart = this.currentScale;
                }

                this.pauseAutoRotateTemporarily();
            }

            onPointerMove(e) {
                if (!this.activePointers.has(e.pointerId)) return;

                const prevPos = this.activePointers.get(e.pointerId);
                const currentPos = { x: e.clientX, y: e.clientY };

                if (this.activePointers.size === 1) {
                    // ОДИН ПАЛЕЦ / МЫШКА: Вращение ракеты
                    const dx = currentPos.x - prevPos.x;
                    const dy = currentPos.y - prevPos.y;

                    this.rotY += dx * 0.45;
                    this.rotX += dy * 0.35;

                    this.applyTransform();
                } else if (this.activePointers.size >= 2) {
                    // ДВА ПАЛЬЦА: Зум (Pinch-to-zoom)
                    this.activePointers.set(e.pointerId, currentPos);
                    const pointers = Array.from(this.activePointers.values());
                    const currentDist = Math.hypot(pointers[1].x - pointers[0].x, pointers[1].y - pointers[0].y);

                    if (this.initialPinchDistance > 10) {
                        const ratio = currentDist / this.initialPinchDistance;
                        this.setScale(this.scaleAtPinchStart * ratio);
                    }
                }

                this.activePointers.set(e.pointerId, currentPos);
                this.pauseAutoRotateTemporarily();
            }

            onPointerUp(e) {
                try { this.touchSurface.releasePointerCapture(e.pointerId); } catch (_) {}
                this.activePointers.delete(e.pointerId);
                if (this.activePointers.size === 0) {
                    this.isPointerDown = false;
                }
            }

            // Колесико мыши (зум на компьютере)
            onWheel(e) {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
                this.setScale(this.currentScale * zoomFactor);
                this.pauseAutoRotateTemporarily();
            }

            // Пауза авто-вращения при касании пользователем
            pauseAutoRotateTemporarily() {
                if (this.inactivityTimer) clearTimeout(this.inactivityTimer);
                this.inactivityTimer = setTimeout(() => {
                    this.inactivityTimer = null;
                }, 3500);
            }

            // --- КНОПКИ УПРАВЛЕНИЯ ---
            zoomIn() {
                this.setScale(this.currentScale * 1.25);
                this.pauseAutoRotateTemporarily();
            }

            zoomOut() {
                this.setScale(this.currentScale * 0.80);
                this.pauseAutoRotateTemporarily();
            }

            rotateLeft() {
                this.rotY -= 30;
                this.applyTransform();
                this.pauseAutoRotateTemporarily();
            }

            rotateRight() {
                this.rotY += 30;
                this.applyTransform();
                this.pauseAutoRotateTemporarily();
            }

            toggleAutoRotate() {
                this.autoRotate = !this.autoRotate;
                if (this.autoRotate) {
                    this.btnAutoSpin.textContent = '⏸';
                    this.btnAutoSpin.classList.add('active-toggle');
                } else {
                    this.btnAutoSpin.textContent = '▶';
                    this.btnAutoSpin.classList.remove('active-toggle');
                }
            }

            resetView() {
                // Сброс в начальную позицию: носом ВВЕРХ
                this.rotX = -90;
                this.rotY = 0;
                this.setScale(this.baseScale);
                this.applyTransform();
                this.showZoomFeedback("Сброс вида ↺");
            }

            // Установка масштаба ракеты
            setScale(val) {
                this.currentScale = Math.max(this.minScale, Math.min(this.maxScale, val));
                this.applyTransform();
                const percent = Math.round((this.currentScale / this.baseScale) * 100);
                this.showZoomFeedback(`Масштаб: ${percent}%`);
            }

            showZoomFeedback(text) {
                this.zoomBadge.textContent = text;
                this.zoomBadge.classList.add('show');
                if (this.zoomBadgeTimeout) clearTimeout(this.zoomBadgeTimeout);
                this.zoomBadgeTimeout = setTimeout(() => {
                    this.zoomBadge.classList.remove('show');
                }, 1200);
            }

            // Применение текущих углов вращения и масштаба
            applyTransform() {
                if (!this.assemblyEl || !this.assemblyEl.object3D) return;

                const s = this.currentScale;
                if (this.modelEl && this.modelEl.object3D) {
                    this.modelEl.object3D.scale.set(s, s, s);
                }

                // Вращаем весь интерактивный блок ракеты вместе с огнем и кольцами
                const radX = (this.rotX * Math.PI) / 180;
                const radY = (this.rotY * Math.PI) / 180;
                this.assemblyEl.object3D.rotation.set(radX, radY, 0);
            }

            // Кадр анимации (60 FPS)
            tick(now) {
                const dt = (now - this.lastTime) / 1000;
                this.lastTime = now;

                // Авто-вращение ракеты, когда пользователь не взаимодействует
                if (this.autoRotate && !this.isPointerDown && !this.inactivityTimer) {
                    this.rotY += this.autoRotateSpeed * dt;
                    if (this.rotY >= 360) this.rotY -= 360;
                    this.applyTransform();
                }

                // Плавное вращение орбитальных колец и пламени сопла
                const orbitRing = document.getElementById('orbitRing');
                const outerRing = document.getElementById('outerRing');
                const flameLight = document.getElementById('engineFlameLight');

                if (orbitRing && orbitRing.object3D) {
                    orbitRing.object3D.rotation.z += 0.8 * dt;
                }
                if (outerRing && outerRing.object3D) {
                    outerRing.object3D.rotation.z -= 0.5 * dt;
                }
                if (flameLight) {
                    const pulse = 3.0 + Math.sin(now * 0.01) * 0.8;
                    flameLight.setAttribute('intensity', pulse.toFixed(2));
                }

                requestAnimationFrame(this.tick.bind(this));
            }
        }

        // Инициализация при готовности DOM
        window.addEventListener('DOMContentLoaded', () => {
            window.arControls = new RocketInteractiveController();
            window.rocketControls = window.arControls;
            window.modelControls = window.arControls;
        });

        // Слушатели событий маркера для AR режима
        const marker = document.getElementById('arMarker');
        const markerIndicator = document.getElementById('markerIndicator');

        if (marker) {
            marker.addEventListener('markerFound', () => {
                if (markerIndicator) markerIndicator.style.display = 'none';
            });

            marker.addEventListener('markerLost', () => {
                if (markerIndicator) markerIndicator.style.display = 'block';
            });
        }

        // Скрытие экрана загрузки
        function hideLoader() {
            const loader = document.getElementById('loadingOverlay');
            if (loader && !loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
                setTimeout(() => { loader.style.display = 'none'; }, 600);
            }
        }

        window.addEventListener('load', () => setTimeout(hideLoader, 500));
        setTimeout(hideLoader, 2000);
    </script>
</body>

</html>
