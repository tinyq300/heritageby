<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="60%" stop-color="#240509"/>
      <stop offset="100%" stop-color="#120104"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA8010"/>
      <stop offset="100%" stop-color="#FFDF73"/>
    </linearGradient>
    <linearGradient id="softGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)"/>
  <rect width="600" height="800" fill="url(#softGold)"/>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="550" height="750" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="730" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3" stroke-dasharray="6,4"/>

  <!-- Corner Ornaments -->
  <path d="M 45 65 L 65 45 L 45 45 Z" fill="url(#goldGrad)" opacity="0.8"/>
  <path d="M 555 65 L 535 45 L 555 45 Z" fill="url(#goldGrad)" opacity="0.8"/>
  <path d="M 45 735 L 65 755 L 45 755 Z" fill="url(#goldGrad)" opacity="0.8"/>
  <path d="M 555 735 L 535 755 L 555 755 Z" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Central Cameo / Portrait Medallion -->
  <ellipse cx="300" cy="330" rx="170" ry="210" fill="#1C0307" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <ellipse cx="300" cy="330" rx="155" ry="195" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.7"/>

  <!-- Female Silhouette / Cameo Base -->
  <path d="M 300 175 C 335 175 360 205 360 245 C 360 280 340 305 320 315 C 335 325 385 350 395 440 C 395 450 380 460 300 460 C 220 460 205 450 205 440 C 215 350 265 325 280 315 C 260 305 240 280 240 245 C 240 205 265 175 300 175 Z" fill="url(#goldGrad)" opacity="0.25"/>

  <!-- Icon Overlay in Medallion -->
  <g transform="translate(300, 320) scale(1.3)" stroke="url(#goldGrad)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="0,-35 25,-15 25,20 0,35 -25,20 -25,-15" /><path d="M-12,0 L0,12 L18,-8" />
  </g>

  <!-- Monogram Initials Badge -->
  <circle cx="300" cy="460" r="36" fill="#240509" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <text x="300" y="469" font-family="'Philosopher', serif" font-size="22" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">ЕМ</text>

  <!-- Typography -->
  <text x="300" y="580" font-family="'Philosopher', 'Times New Roman', serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    Елена Моргунова
  </text>
  
  <line x1="200" y1="605" x2="400" y2="605" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
  <polygon points="300,601 306,605 300,609 294,605" fill="url(#goldGrad)"/>

  <text x="300" y="640" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="20" font-style="italic" fill="#D4AF37" text-anchor="middle">
    Председатель Госстандарта Беларуси
  </text>

  <text x="300" y="710" font-family="'Philosopher', serif" font-size="14" fill="#AA8010" text-anchor="middle" letter-spacing="3">
    ВЕЧНЫЕ ОБРАЗЫ БЕЛАРУСИ
  </text>
</svg>